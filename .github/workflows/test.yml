name: 'test'
on:
  pull_request:
    paths: ['**.go', 'assets/**', 'tpl/**', 'go.mod', 'package*.json', 'vite.config.js', '.github/workflows/*']
  push:
    branches: ['main']

jobs:
  # Vite assets
  assets:
    name:    'assets'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v6'
      - uses: 'actions/setup-node@v6'
        with:
          node-version: 24
          cache: 'npm'
      - run: 'npm ci'
      - run: 'npm run build'
      - uses: 'actions/upload-artifact@v4'
        with:
          name: 'public'
          path: 'public'
          retention-days: 1

  # staticcheck
  staticcheck:
    needs:   'assets'
    name:    'staticcheck'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v6'
      - uses: 'actions/download-artifact@v4'
        with:
          name: 'public'
          path: 'public'
      - uses: 'dominikh/staticcheck-action@v1'

  # Ubuntu x86 and ARM SQLite
  test:
    needs:   'assets'
    strategy:
      matrix:
        os: ['ubuntu-latest', 'ubuntu-24.04-arm']
    runs-on: "${{ matrix.os }}"
    name:    "${{ matrix.os }} / sqlite"
    steps:
      - uses: 'actions/checkout@v6'
      - uses: 'actions/download-artifact@v4'
        with:
          name: 'public'
          path: 'public'
      - uses: 'actions/setup-go@v6'
        with: {go-version: 'stable'}
      - shell: 'bash'
        run: |
          go test -race ./...
