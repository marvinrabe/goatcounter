name: 'build'
on:
  push:         {branches: ['main'], tags: ['v*']}
  pull_request: {}

permissions:
  contents: 'read'
  packages: 'write'

jobs:
  build:
    runs-on: 'ubuntu-latest'
    # Note: this runs independently of the test workflow; "needs: test" only
    # works between jobs in the same workflow.
    steps:
      - uses: 'actions/checkout@v6'
      - uses: 'docker/setup-buildx-action@v4'
      - uses: 'docker/login-action@v4'
        if: ${{ github.event_name != 'pull_request' }}
        with:
          registry: 'ghcr.io'
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: 'docker/metadata-action@v5'
        id: 'meta'
        with:
          images: 'ghcr.io/${{ github.repository }}'
          tags:   "type=semver,pattern={{version}}\ntype=semver,pattern={{major}}.{{minor}}\ntype=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}"
      - uses: 'docker/build-push-action@v6'
        with:
          context:    '.'
          file:       './Dockerfile'
          # Cross-building arm64 under QEMU takes ~10 min instead of ~1 min;
          # splitting it over a native arm64 runner would be faster, but is a lot
          # more machinery: https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners
          platforms:  'linux/amd64,linux/arm64'
          tags:       ${{ steps.meta.outputs.tags }}
          labels:     ${{ steps.meta.outputs.labels }}
          push:       ${{ github.event_name != 'pull_request' }}
          cache-from: 'type=registry,ref=ghcr.io/${{ github.repository }}:latest'
          cache-to:   'type=inline'
