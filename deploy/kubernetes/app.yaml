# Supply a Secret named goatcounter-config containing GOATCOUNTER_DB (a shared
# primary libSQL URL). Optional auth/API settings can be added to that Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goatcounter
spec:
  replicas: 3
  minReadySeconds: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: goatcounter
  template:
    metadata:
      labels:
        app: goatcounter
    spec:
      # Use DNS service discovery without injecting service environment
      # variables into application configuration.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: goatcounter
      containers:
        - name: goatcounter
          # Replace with the immutable image for your release.
          image: goatcounter:cluster-test
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: goatcounter-config
          env:
            - name: GOATCOUNTER_SITES
              value: example.com,foobar.net
            - name: GOATCOUNTER_LISTEN
              value: ':8080'
            - name: GOATCOUNTER_STORE_EVERY
              value: '1'
            - name: GOATCOUNTER_DRAIN_DELAY
              value: '5'
            - name: GOATCOUNTER_SHUTDOWN_TIMEOUT
              value: '25'
            - name: GOMEMLIMIT
              value: 96MiB
            - name: GOGC
              value: '50'
          startupProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 1
            failureThreshold: 1
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: goatcounter
spec:
  selector:
    app: goatcounter
  ports:
    - name: http
      port: 8080
      targetPort: http
