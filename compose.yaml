# Simple compose for testing. SQLite only, no TLS (put a reverse proxy in
# front for that).
#
# The site is created automatically on first run; create a user for basic auth
# with:
#
#     docker compose run --rm goatcounter db create user \
#         -db=sqlite+/home/goatcounter/goatcounter-data/db.sqlite3 -createdb \
#         -email=admin@example.com \
#         -password=password
#
# Dashboard: http://localhost:8080 — log in with any username and the password
# above. Track pageviews with:
#
#     <script data-goatcounter="http://localhost:8080/count"
#             async src="//localhost:8080/count.js"></script>

services:
  goatcounter:
    build: .
    ports:
      - '8080:8080'
    volumes:
      - 'goatcounter-data:/home/goatcounter/goatcounter-data'
    environment:
      GOATCOUNTER_LISTEN: ':8080'
      # Timezone the dashboard is displayed in; applies to the whole
      # installation. Defaults to UTC.
      TZ: 'UTC'

      # Collect garbage at 50% heap growth instead of Go's default of 100%,
      # trading a little CPU for a noticeably smaller resident size. This is
      # the right trade here: the process is idle most of the time.
      GOGC: '50'
      # Soft limit on the Go heap: as usage approaches it the GC runs more
      # aggressively rather than growing. It is not a reservation, so a low
      # value costs nothing when the app is idle. SQLite's page cache and the
      # memory-mapped GeoIP database sit outside this, which is what mem_limit
      # below accounts for.
      GOMEMLIMIT: '96MiB'

    # Hard backstop. Go heap (<=96M) + SQLite page cache (4M per connection,
    # -dbconn defaults to 4 open) + the mmapped GeoIP database, which is
    # reclaimable page cache rather than anonymous memory.
    mem_limit: 256m
    memswap_limit: 256m

volumes:
  goatcounter-data: {}
